
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOFI GAME</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; user-select: none; }
    body { background-color: #120c10; color: #fff; font-family: 'Press Start 2P', monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; }
    .container { background-color: #2b1d28; border: 4px solid #5a3d52; box-shadow: inset 0 0 0 4px #1a1016, 0 8px 0 #000; padding: 15px; max-width: 450px; width: 100%; text-align: center; }
    h1 { font-size: 14px; color: #fca311; text-shadow: 2px 2px #000; margin: 0 0 15px 0; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-height: 260px; overflow-y: scroll; padding: 4px; margin-bottom: 15px; background-color: #1a1016; border: 2px solid #000; }
    .btn-level { background-color: #3a405a; color: #fff; font-family: 'Press Start 2P', monospace; font-size: 7px; padding: 8px 2px; border: 2px solid #000; box-shadow: inset -1px -1px 0px #1d202d, inset 1px 1px 0px #68719d; cursor: pointer; text-align: center; word-break: break-word; line-height: 1.3; display: block; width: 100%; }
    .btn-level:active { background-color: #fca311; color: #000; }
    .btn-new { background-color: #2a6f97; box-shadow: inset -1px -1px 0px #013a63, inset 1px 1px 0px #4ea8de; }
    .description-box { background-color: #000; border: 3px solid #fff; padding: 10px; text-align: left; min-height: 80px; }
    .description-title { color: #4cc9f0; font-size: 9px; margin-bottom: 8px; }
    .description-text { color: #fff; font-size: 8px; line-height: 1.5; }
  </style>
</head>
<body>
<div class="container">
  <h1>SOFI GAME</h1>
  <div class="grid">
    <button class="btn-level" onclick="showDesc('1. LEVEL 0', 'Nivel clasico.')">1. Level 0</button>
    <button class="btn-level" onclick="showDesc('2. CAIDA', 'Nivel clasico.')">2. Caida</button>
    <button class="btn-level" onclick="showDesc('3. AGUJEROS 34', 'Nivel clasico.')">3. Agujeros 34</button>
    <button class="btn-level" onclick="showDesc('4. LINDA CALLE', 'Nivel clasico.')">4. Linda calle</button>
    <button class="btn-level" onclick="showDesc('5. ESCALERAS', 'Nivel clasico.')">5. Escaleras</button>
    <button class="btn-level" onclick="showDesc('6. HOTEL 188', 'Nivel clasico.')">6. Hotel 188</button>
    <button class="btn-level" onclick="showDesc('7. PASILLOS', 'Nivel clasico.')">7. Pasillos</button>
    <button class="btn-level" onclick="showDesc('8. ESPEJOS', 'Nivel clasico.')">8. Espejos</button>
    <button class="btn-level" onclick="showDesc('9. POOLROOMS', 'Nivel clasico.')">9. Poolrooms</button>
    <button class="btn-level" onclick="showDesc('10. HELLO KITTY', 'Nivel clasico.')">10. Hello kitty</button>
    <button class="btn-level" onclick="showDesc('11. HELLO KITTY G', 'Nivel clasico.')">11. Hello kitty G</button>
    <button class="btn-level" onclick="showDesc('12. OJOS 131.4', 'Nivel clasico.')">12. Ojos 131.4</button>
    <button class="btn-level" onclick="showDesc('13. SIMULACION 78', 'Nivel clasico.')">13. Simulacion 78</button>
    <button class="btn-level btn-new" onclick="showDesc('14. RUN :)', 'Mover palancas hasta que se abra la salida.')">14. Run :)</button>
    <button class="btn-level btn-new" onclick="showDesc('15. ROBA UN BRAINROT', 'Un juego que marco tu vida.')">15. Roba un Brainrot</button>
    <button class="btn-level btn-new" onclick="showDesc('16. BOSQUE', 'Solo busca una puerta.')">16. Bosque</button>
    <button class="btn-level btn-new" onclick="showDesc('17. FUN', 'Fiesta divertida.')">17. Fun</button>
    <button class="btn-level btn-new" onclick="showDesc('18. PISO FLOTANTE', 'Estructuras y bloques suspendidos en el vacio donde solo caminas con cuidado por pasillos y caminos muy estrechos.')">18. Piso flotante</button>
  </div>
  <div class="description-box">
    <div class="description-title" id="levelTitle">SELECCIONA UN NIVEL</div>
    <div class="description-text" id="levelDesc">Haz clic en un nivel para ver los detalles.</div>
  </div>
</div>
<script>
  function showDesc(title, desc) {
    document.getElementById('levelTitle').innerText = title;
    document.getElementById('levelDesc').innerText = desc;
  }
</script>
</body>
</html>
